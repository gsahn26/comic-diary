<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>네컷일기 · AI 4컷 만화 일기</title>
  <meta name="description" content="오늘의 일기를 AI가 4컷 웹툰으로 바꿔 주는 무료 웹앱" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>📔 네컷일기</h1>
    <nav>
      <button class="tab active" data-view="write">만들기</button>
      <button class="tab" data-view="gallery">갤러리 <span id="galleryCount"></span></button>
    </nav>
  </header>

  <main>
    <!-- 1. 일기 쓰기 -->
    <section id="step-write" class="card view-write">
      <h2><span class="num">1</span> 오늘의 일기</h2>
      <label class="field">
        <span>일기</span>
        <textarea id="diary" rows="7" maxlength="1500" placeholder="예) 아침에 늦잠을 자서 버스를 놓쳤다. 뛰어가다 넘어졌는데 친구가 웃으면서 도와줬다. 점심엔 둘이서 떡볶이를 먹었고, 저녁엔 고양이랑 낮잠을 잤다."></textarea>
      </label>
      <label class="field">
        <span>주인공 생김새 <small>(선택 · 4컷 내내 같은 모습으로 그려요)</small></span>
        <input id="hero" type="text" maxlength="120" placeholder="예) 단발머리, 동그란 안경, 노란 후드티를 입은 20대 여자" />
      </label>
      <div class="row">
        <button id="btnSplit" class="primary">✨ AI로 4컷 나누기</button>
        <button id="btnManual" class="ghost">직접 4컷 쓰기</button>
      </div>
      <p id="splitStatus" class="status" role="status"></p>
    </section>

    <!-- 2. 4컷 편집 -->
    <section id="step-edit" class="card view-write hidden">
      <h2><span class="num">2</span> 4컷 다듬기</h2>
      <label class="field">
        <span>만화 제목</span>
        <input id="title" type="text" maxlength="30" />
      </label>
      <label class="field">
        <span>주인공 묘사 <small>(매 컷 그림에 똑같이 들어가요)</small></span>
        <input id="character" type="text" maxlength="200" />
      </label>
      <div id="panelEditors" class="panel-editors"></div>
      <div class="row">
        <button id="btnDraw" class="primary">🎨 그림 그리기</button>
        <button id="btnBack" class="ghost">← 일기 고치기</button>
      </div>
      <p class="hint">무료 이미지 서버는 45초에 1장만 그릴 수 있어서 4컷 완성까지 약 3분 걸려요. 창을 닫지 말고 기다려 주세요.</p>
    </section>

    <!-- 3. 결과 -->
    <section id="step-result" class="card view-write hidden">
      <h2><span class="num">3</span> 완성된 네컷</h2>
      <p id="drawStatus" class="status" role="status"></p>
      <div class="canvas-wrap"><canvas id="comic" width="1080" height="1240"></canvas></div>
      <div id="panelControls" class="panel-controls"></div>
      <div class="row">
        <button id="btnDownload" class="primary" disabled>⬇️ PNG 다운로드</button>
        <button id="btnSave" class="ghost" disabled>💾 갤러리에 저장</button>
        <button id="btnNew" class="ghost">새 일기 쓰기</button>
      </div>
    </section>

    <!-- 갤러리 -->
    <section id="gallery" class="card view-gallery">
      <h2>내 네컷 갤러리</h2>
      <p class="hint">이 브라우저에만 저장돼요. 다른 기기에서는 보이지 않아요.</p>
      <div id="galleryGrid" class="gallery-grid"></div>
    </section>
  </main>

  <dialog id="viewer">
    <img id="viewerImg" alt="" />
    <div class="row">
      <a id="viewerDownload" class="btn primary" download>⬇️ 다운로드</a>
      <button id="viewerDelete" class="ghost danger">삭제</button>
      <button id="viewerClose" class="ghost">닫기</button>
    </div>
  </dialog>

  <footer>
    그림: <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a> (무료) · 일기 내용은 4컷 나누기·그림 생성을 위해 Pollinations로 전송돼요. 개인정보는 적지 마세요.
  </footer>

  <script src="app.js"></script>
</body>
</html>
